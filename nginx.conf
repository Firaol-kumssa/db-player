# Always revalidate pages, scripts, language files and captions, so a new version shows on the next
# normal reload (no stale copies in the browser). Media and images may be cached as usual.
map $uri $db_cache_control {
  ~*\.(html|js|mjs|json|vtt)$ "no-cache";
  default "";
}

server {
  listen 80;
  root /srv/savanna;
  index index.html;
  charset utf-8;
  charset_types text/css application/javascript application/json text/vtt text/plain;
  gzip on;
  gzip_types text/css application/javascript application/json text/vtt;
  add_header Cache-Control $db_cache_control always;

  # Our files live beside the untouched Savanna starter, not inside it.
  location ^~ /module/ { root /srv; }
  location ^~ /media/ {
    root /srv;
    location ~ \.vtt$ { root /srv; types { } default_type text/vtt; }
  }
  location ^~ /demo/ { root /srv; }
  location / { try_files $uri $uri/ =404; }
}
