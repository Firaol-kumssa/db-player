services:
  web:
    image: nginx:alpine
    ports: ["${WEB_PORT:-8080}:80"]
    volumes:
      - ./savanna:/srv/savanna:ro
      - ./module:/srv/module:ro
      - ./media:/srv/media:ro
      - ./demo:/srv/demo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "api/server.mjs"]
    ports: ["${API_PORT:-8081}:8081"]
    environment:
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8080/media/}
      CAPTION_WEBHOOK_URL: ${CAPTION_WEBHOOK_URL:-}
    volumes:
      - ./api:/app/api
      - ./media:/app/media:ro
      - ./openapi.yaml:/app/openapi.yaml:ro
